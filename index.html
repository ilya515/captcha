<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проверка перед входом</title>
<!-- Страница проверки для бота «Старший по чату».

     Она статическая: своего сервера здесь нет и не нужно. Порядок такой:
       1. бот открывает эту страницу кнопкой в личке;
       2. площадка (Cloudflare Turnstile или hCaptcha) выдаёт токен;
       3. страница отдаёт токен боту методом sendData — обычным сообщением;
       4. бот сам спрашивает у площадки, настоящий ли токен.
     Поэтому здесь лежит только ПУБЛИЧНЫЙ ключ. Секретный живёт в .env
     рядом с ботом и сюда попадать не должен никогда.

     Что поправить перед выкладкой — две строки ниже. -->
<script>
  // ── ЧТО ПОМЕНЯТЬ ───────────────────────────────────────────────────
  // 1. Публичный ключ площадки (Site key).
  var SITE_KEY = '0x4AAAAAAEyKc_Ud3a3BDyu5';
  // 2. Какая площадка: 'turnstile' или 'hcaptcha'. Должно совпадать с
  //    CAPTCHA_APP_PROVIDER в .env у бота.
  var PROVIDER = 'turnstile';
  // 3. Второй уровень — как у group help: вместо галочки головоломка с
  //    картинками. Площадка другая, значит и ключ другой. Заводится на
  //    dashboard.hcaptcha.com, бесплатно. Пусто — второй уровень просто
  //    не включится, первый будет работать как работал.
  var SITE_KEY_2 = '';
  var PROVIDER_2 = 'hcaptcha';
  // ───────────────────────────────────────────────────────────────────
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1c1c1e; --muted: #6b6b70;
    --card: #f4f4f6; --line: #e3e3e8; --ok: #1f9d55; --bad: #c8342b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17212b; --fg: #f1f1f1; --muted: #9aa7b4;
      --card: #1f2c38; --line: #2b3a49; --ok: #4bbf7a; --bad: #e56a60;
    }
  }
  /* Telegram подставляет свою тему переменными — она главнее нашей догадки. */
  body {
    margin: 0; padding: 24px 16px;
    background: var(--tg-theme-bg-color, var(--bg));
    color: var(--tg-theme-text-color, var(--fg));
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.hint {
    margin: 0 0 24px; font-size: 15px;
    color: var(--tg-theme-hint-color, var(--muted));
  }
  .box {
    display: flex; justify-content: center; min-height: 78px;
    margin-bottom: 20px;
  }
  .state { font-size: 15px; min-height: 24px; }
  .state.ok { color: var(--ok); }
  .state.bad { color: var(--bad); }
  .setup {
    text-align: left; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; font-size: 14px;
  }
  .setup code {
    background: rgba(127, 127, 127, .18); border-radius: 4px;
    padding: 1px 5px; font-size: 13px;
  }
  .setup b { display: block; margin-bottom: 8px; }
  .back { display: block; margin: 18px auto 0; max-width: 320px; padding: 14px 18px;
          border-radius: 12px; background: #2ea6ff; color: #fff; font-weight: 600;
          text-align: center; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Проверка перед входом</h1>
  <p class="hint" id="hint">Подтвердите, что вы не робот — и бот впустит вас в чат.</p>
  <div class="box" id="box"></div>
  <div class="state" id="state"></div>
</div>

<script>
// Имя вашего бота без @ — нужно для входа по прямой ссылке на приложение.
// Для остальных видов проверки заполнять не обязательно.
var BOT_NAME = 'moderatosina_bot';
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var box = document.getElementById('box');
  var state = document.getElementById('state');
  var hint = document.getElementById('hint');
  var params = new URLSearchParams(location.search);
  var chatId = params.get('chat') || '';
  // Кто нас открыл и какая это проверка. Нужно для возврата, когда страницу
  // открыли кнопкой под сообщением: sendData там не работает, и ответ
  // приходится отдавать ссылкой обратно в бота.
  var botName = params.get('bot') || '';
  var cid = params.get('cid') || '';
  // Проверка открыта прямо из кнопки «Подать заявку». Тогда у нас есть билет
  // заявки и адрес, куда вернуть ответ: sendData здесь не работает — кнопки
  // клавиатуры нет вовсе, приложение открыл сам Telegram.
  var jr = params.get('jr') || '';
  var api = params.get('api') || '';
  // Уровень проверки выбирает бот и пишет в адрес. Ключи у площадок разные,
  // поэтому подменяем и ключ, и площадку — страница при этом остаётся одна.
  var wantLevel2 = params.get('lvl') === '2';
  // Уровень 0: ни Cloudflare, ни hCaptcha — одна своя кнопка. Грузиться
  // нечему, значит и не загрузиться нечему: живой человек проходит всегда.
  // Подлинность подтверждает сам Telegram подписью, её проверяет бот.
  var selfOnly = params.get('lvl') === '0';
  // Ключ первой площадки запоминаем отдельно: если выбран уровень 2, SITE_KEY
  // подменяется на ключ hCaptcha, а для лестницы нужен и первый.
  var SITE_KEY_MAIN = SITE_KEY;
  if (wantLevel2 && SITE_KEY_2) {
    SITE_KEY = SITE_KEY_2;
    PROVIDER = PROVIDER_2;
  }
  // Вход по прямой ссылке на приложение: чат и бот приходят не в адресе
  // страницы, а из самого Telegram — он передаёт их в start_param.
  var startParam = '';
  try {
    startParam = (window.Telegram && window.Telegram.WebApp &&
                  window.Telegram.WebApp.initDataUnsafe &&
                  window.Telegram.WebApp.initDataUnsafe.start_param) || '';
  } catch (e) {}
  var entryChat = '';
  if (/^c\d+$/.test(startParam)) {
    entryChat = startParam.slice(1);
    if (!chatId) { chatId = '-' + entryChat; }
  }
  // Приложение открыли кнопкой проверки: в start_param пришёл номер самой
  // проверки. Тогда после капчи возвращаемся в бота именно с ним.
  if (/^k\d+$/.test(startParam) && !cid) {
    cid = startParam.slice(1);
    if (!chatId) { chatId = 'app'; }
  }

  if (tg) { tg.ready(); tg.expand(); }

  // Любая беда на этой странице кончается одинаково: человек не понимает, что
  // делать. Поэтому выход показывается сам — при каждой ошибке, какой бы она
  // ни была. Одно место вместо пятнадцати, и забыть его негде.
  var escapeShown = false;

  function say(text, cls) {
    state.textContent = text;
    state.className = 'state' + (cls ? ' ' + cls : '');
    if (cls === 'bad') { showEscape(); }
  }

  function showEscape(label) {
    if (escapeShown) { return; }
    var name = botName || BOT_NAME;
    if (!name) { return; }
    escapeShown = true;
    var link = document.createElement('a');
    link.className = 'back';
    link.href = 'https://t.me/' + name + (cid ? '?start=capok_' + cid : '');
    link.textContent = label || ('💬 Перейти к боту @' + name + ' в личку');
    box.appendChild(link);
    var tail = document.createElement('div');
    tail.className = 'setup';
    tail.textContent = 'Нажмите кнопку выше — бот примет проверку в личных '
        + 'сообщениях, и вы попадёте в чат. Заявка при этом никуда не делась.';
    box.appendChild(tail);
  }

  // Ключ не подставили — объясняем это здесь, а не оставляем пустой экран:
  // иначе человек видит белый лист и думает, что чат сломан.
  // Бот просил второй уровень, а ключа для него нет. Проверку при этом не
  // отменяем — человек не виноват и должен войти в чат: показываем первый
  // уровень, он рабочий. Но и молчать нельзя, иначе владелец чата видит не
  // тот вид, который выбрал, и ищет поломку там, где её нет. Поэтому внизу
  // подписываем, что подменили и почему.
  var level2Missing = wantLevel2 && !SITE_KEY_2;
  if (selfOnly) {
    var mine = document.createElement('button');
    mine.className = 'back';
    mine.textContent = '✅ Я не робот';
    mine.onclick = function () {
      mine.disabled = true;
      mine.textContent = 'Проверяем…';
      done('self');
    };
    box.appendChild(mine);
    hint.textContent = 'Одно нажатие — и бот впустит вас в чат.';
    return;
  }
  if (!SITE_KEY || SITE_KEY.indexOf('ВСТАВЬТЕ') === 0) {
    hint.textContent = '';
    box.innerHTML = '<div class="setup"><b>⚙️ Страница ещё не настроена</b>' +
      'В файле <code>index.html</code> впишите публичный ключ площадки в ' +
      '<code>SITE_KEY</code>, а секретный — в <code>CAPTCHA_APP_SECRET</code> ' +
      'в <code>.env</code> у бота. Подробно — в ' +
      '<code>КАПЧА_ПРИЛОЖЕНИЕ_RU.txt</code>.</div>';
    return;
  }
  if (!chatId && !entryChat && !jr) {
    say('Ссылка открыта не из бота. Вернитесь в чат с ботом и нажмите кнопку проверки.', 'bad');
    return;
  }

  // Результат уходит боту обычным сообщением. sendData работает только для
  // кнопки обычной клавиатуры — бот именно такую и присылает.
  function done(token) {
    say('✅ Проверка пройдена, возвращаемся…', 'ok');
    var payload = JSON.stringify({ chat: Number(chatId), token: token });
    // Путь нулевой, самый короткий: заявка на вступление. Ответ уходит боту
    // напрямую, и заявка одобряется прямо здесь — человек даже не выходит
    // из группы. Подпись Telegram шлём как есть: бот проверит её сам.
    if (jr && api) {
      sendToBot(token);
      return;
    }
    // Путь первый: страницу открыли кнопкой обычной клавиатуры. Тогда токен
    // уходит боту сообщением, и площадка подтверждает его по-настоящему.
    if (tg && tg.sendData) {
      try { tg.sendData(payload); return; } catch (e) {}
    }
    // Путь третий: вход по прямой ссылке на приложение. Заявки нет вовсе —
    // бот выдаст разовое приглашение в чат.
    if (entryChat) {
      backTo((botName ? botName : BOT_NAME) + '?start=join_c' + entryChat, 'Войти в чат');
      return;
    }
    // Путь второй: кнопка была под сообщением. sendData там не работает, и
    // ответ возвращается ссылкой в бота — она же закрывает страницу.
    if (cid) {
      backTo((botName || BOT_NAME) + '?start=capok_' + cid, 'Вернуться к боту');
      return;
    }
    say('Откройте проверку из чата с ботом — иначе ответ не дойдёт.', 'bad');
  }

  // Ответ боту напрямую, минуя Telegram. Нужен только для заявок: там
  // приложение открывает сам Telegram, и обратного канала через него нет.
  function sendToBot(token) {
    var initData = '';
    try { initData = (tg && tg.initData) || ''; } catch (e) {}
    var req = new XMLHttpRequest();
    req.open('POST', api.replace(/\/+$/, '') + '/jr/done', true);
    req.setRequestHeader('Content-Type', 'application/json');
    req.timeout = 15000;
    req.onload = function () {
      var ok = false, error = '';
      try {
        var body = JSON.parse(req.responseText || '{}');
        ok = !!body.ok; error = String(body.error || '');
      } catch (e) {}
      if (ok) {
        say('✅ Готово, вы в чате.', 'ok');
        setTimeout(function () { try { tg.close(); } catch (e) {} }, 900);
        return;
      }
      // Разные беды — разные подсказки. «expired» человек лечит сам, всё
      // остальное лечит владелец чата, и ему нужен код.
      if (error === 'expired') {
        say('Проверка устарела. Подайте заявку ещё раз.', 'bad');
      } else if (error === 'captcha') {
        say('Проверка не пройдена. Попробуйте ещё раз.', 'bad');
      } else {
        say('Ответ не принят' + (error ? ' (' + error + ')' : '') +
            '. Напишите администратору чата.', 'bad');
      }
    };
    req.onerror = function () {
      // Две разные беды выглядят одинаково, а лечатся по-разному: бот не
      // запущен (или туннель умер) — и браузер не пустил запрос из-за
      // разрешений. Показываем адрес: по нему владелец сразу поймёт, какая.
      say('Не достучались до бота.\n\nАдрес: ' + api +
          '\n\nВладельцу чата: откройте этот адрес с /jr/ping в браузере. '
          + 'Пусто — туннель не работает, бот не получил ответ. '
          + 'Заявка осталась, администратор её увидит.', 'bad');
    };
    req.ontimeout = function () {
      say('Бот не ответил за 15 секунд — заявка осталась, '
          + 'администратор её увидит.', 'bad');
    };
    try {
      req.send(JSON.stringify({ jr: jr, token: token, initData: initData }));
    } catch (e) {
      say('Отправить ответ не вышло. Напишите администратору чата.', 'bad');
    }
  }

  // Возврат в бота: одной кнопкой и попыткой уйти туда самому. Одно место
  // на оба случая — и кнопку под сообщением, и прямую ссылку.
  function backTo(tail, label) {
    var back = 'https://t.me/' + tail;
    var link = document.createElement('a');
    link.href = back;
    link.className = 'back';
    link.textContent = '✅ ' + label;
    box.appendChild(link);
    hint.textContent = 'Если ничего не произошло — нажмите кнопку выше.';
    if (tg && tg.openTelegramLink) {
      setTimeout(function () { try { tg.openTelegramLink(back); } catch (e) {} }, 400);
    } else {
      setTimeout(function () { location.href = back; }, 400);
    }
  }

  function failed(code) {   // оставлено для старых путей возврата
    // Turnstile передаёт код ошибки. Коды 1100х — это отказ по настройке
    // (чаще всего домен), а не «человек не прошёл». Разные беды — разные
    // подсказки, иначе владелец чата ищет проблему не там.
    var c = String(code || '');
    if (c.indexOf('1100') === 0 || c.indexOf('1101') === 0 || c.indexOf('1102') === 0) {
      say('Проверка отклонена настройкой площадки — вы тут ни при чём. '
          + 'Пройдите её у бота в личных сообщениях, кнопка ниже.', 'bad');
      hint.innerHTML = 'Владельцу чата: в Cloudflare у виджета должен быть '
          + 'разрешён домен <code>' + location.hostname + '</code> — поле '
          + 'Domain. Код: ' + c;
      return;
    }
    say('Проверка не пройдена. Попробуйте ещё раз.' + (c ? ' Код: ' + c : ''), 'bad');
  }


  var holder = document.createElement('div');
  box.appendChild(holder);

  // ── Лестница проверок ───────────────────────────────────────────────
  //
  // У виджетов Cloudflare и hCaptcha один общий изъян: они грузятся с чужих
  // серверов. Не загрузился — и живой человек стоит перед пустым местом, а
  // виноватым выглядит чат. Поэтому не одна проверка, а лестница: не вышло —
  // пробуем следующую, и так до той, которой грузить нечего.
  //
  //   1. та площадка, что выбрана в боте
  //   2. вторая площадка (у них разные сети и блокируют их по-разному)
  //   3. своя кнопка: ничего не грузится, подпись даёт сам Telegram
  //   4. и всегда на виду — кнопка «пройти у бота в личке»
  //
  // Каждой ступени даётся восемь секунд. Дольше ждать нельзя: человек решит,
  // что чат сломан, и уйдёт.
  var steps = [];
  if (PROVIDER === 'hcaptcha' && SITE_KEY) {
    steps.push({ kind: 'hcaptcha', key: SITE_KEY });
    if (SITE_KEY_MAIN) { steps.push({ kind: 'turnstile', key: SITE_KEY_MAIN }); }
  } else {
    if (SITE_KEY) { steps.push({ kind: 'turnstile', key: SITE_KEY }); }
    if (SITE_KEY_2) { steps.push({ kind: 'hcaptcha', key: SITE_KEY_2 }); }
  }
  steps.push({ kind: 'self', key: '' });

  var stepAt = -1;
  var settled = false;
  var timer = null;

  function escapeButton(text) {
    showEscape(text);
  }

  function ownerNote(extra) {
    hint.innerHTML = (extra || '') +
      ' <span style="opacity:.7">Владельцу чата: если это повторяется, '
      + 'поставьте вид проверки «⚡ Одно нажатие (без ключей)» — ему грузить '
      + 'нечего. Домен площадки должен быть <code>' + location.hostname
      + '</code>.</span>';
  }

  // Ступень не ответила — идём к следующей.
  function nextStep(why) {
    if (settled) { return; }
    if (timer) { clearTimeout(timer); timer = null; }
    holder.innerHTML = '';
    stepAt += 1;
    if (stepAt >= steps.length) {
      settled = true;
      say('Проверка не загружается.\n\nЭто не ваша вина. Пройдите её у бота '
          + 'в личных сообщениях — кнопка ниже.', 'bad');
      escapeButton();
      ownerNote('Ни одна площадка не ответила.');
      return;
    }
    var step = steps[stepAt];
    if (step.kind === 'self') {
      // Последняя ступень: грузить нечего, значит и сломаться нечему.
      say('Подтвердите, что вы не робот.', '');
      var mine = document.createElement('button');
      mine.className = 'back';
      mine.textContent = '✅ Я не робот';
      mine.onclick = function () {
        mine.disabled = true;
        mine.textContent = 'Проверяем…';
        settled = true;
        done('self');
      };
      holder.appendChild(mine);
      escapeButton('💬 Или пройти у бота в личке');
      ownerNote('Площадки не ответили, проверка идёт без них.');
      return;
    }
    render(step, why);
  }

  function render(step, why) {
    var ready = 'onCaptchaReady' + stepAt;
    window[ready] = function () {
      try {
        var api = (step.kind === 'hcaptcha') ? window.hcaptcha : window.turnstile;
        if (!api) { nextStep('нет объекта площадки'); return; }
        api.render(holder, {
          sitekey: step.key,
          theme: (tg && tg.colorScheme) || (step.kind === 'hcaptcha' ? 'light' : 'auto'),
          callback: function (token) { settled = true; done(token); },
          'error-callback': function (code) { nextStep('ошибка ' + code); },
          'expired-callback': function () { nextStep('истекла'); }
        });
      } catch (e) {
        nextStep('исключение');
      }
    };
    var script = document.createElement('script');
    script.async = true;
    script.defer = true;
    script.src = (step.kind === 'hcaptcha')
      ? 'https://js.hcaptcha.com/1/api.js?onload=' + ready + '&render=explicit'
      : 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=' + ready + '&render=explicit';
    script.onerror = function () { nextStep('скрипт не загрузился'); };
    document.head.appendChild(script);
    // Сторож на ступень: виджет мог и не позвать ни одного обработчика.
    timer = setTimeout(function () {
      if (settled) { return; }
      if (holder.querySelector('iframe')) { return; }
      nextStep('молчит восемь секунд');
    }, 8000);
  }

  if (selfOnly) {
    stepAt = steps.length - 2;   // сразу на «свою кнопку»
  }
  nextStep('');
})();
</script>
</body>
</html>
